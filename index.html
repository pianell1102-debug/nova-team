<title>NOVA 팀 페이지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 흰 배경 단일 컬럼. 그림은 팀 로고만 쓰고, 나머지는 선·글자·여백으로만 구분 */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111111; --muted:#6A6A6A; --line:#E7E7E7; --sunk:#F5F5F5;
  --pink:#C2189C; --pink-soft:#FCEAF8; --on-pink:#FFFFFF;
  --yes:#17703F; --yes-soft:#E4F4EA;
  --no:#B3261E; --no-soft:#FCEAE8;
  --maybe:#8A5700; --maybe-soft:#FBF1DA;
  --font-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,dl,dd{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* 헤더 · 탭 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.logo{display:block;height:30px;width:auto;max-width:60vw}
.who{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--muted)}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px 4px;font-size:13px;white-space:nowrap}
.tabs{display:flex}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 2px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pink)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--pink);color:var(--on-pink);font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.banner{background:var(--maybe-soft);color:var(--maybe);font-size:13px;padding-block:8px}

/* 공통 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--no);border-color:var(--no)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.list{display:flex;flex-direction:column;gap:12px;padding-block:4px 56px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.head-row h2{font-size:18px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:12px 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip i{font-style:normal;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.month{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:10px 2px 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.note-banner{display:block;width:100%;text-align:left;margin-top:8px;border:1px solid var(--pink);background:var(--pink-soft);color:var(--pink);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.sub-h{font-size:13px;font-weight:600;color:var(--muted);margin:14px 2px 0}
.maplink{margin-left:6px;font-size:12px;font-weight:600;text-decoration:underline}

/* 일정 카드 */
.ev{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px 14px}
.ev.is-past{opacity:.8}
.ev-date{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;padding:8px 0;line-height:1.15;align-self:start}
.t-train{--tc:#16794A;--tb:#E6F4EC}.t-match{--tc:#C2189C;--tb:#FCEAF8}.t-cup{--tc:#B45309;--tb:#FEF0DC}.t-meet{--tc:#1D4ED8;--tb:#E6EDFF}
.ev{border-left:5px solid var(--tc,var(--line))}
.ev .ev-date{border-color:var(--tc);color:var(--tc)}
.ev .tag.ty{color:var(--tc);border-color:var(--tc);background:var(--tb)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tc);margin-right:6px;vertical-align:baseline}
.chip .dot{background:var(--tc);width:9px;height:9px;margin-right:6px}
.opt input:checked+span.ty{background:var(--tc);border-color:var(--tc);color:#fff}
.opt span.ty{border-color:var(--tc);color:var(--tc)}
.opt input:checked+span.ty{color:#fff}
.tag.ty-pend{background:var(--tb);color:var(--tc);border-color:var(--tc)}
.ev-date .mo,.ev-date .wd{font-size:12px;font-weight:600}
.ev-date .dd{font-family:var(--font-display);font-size:28px;font-variant-numeric:tabular-nums}
.ev-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.tag.pk{color:var(--pink);border-color:var(--pink);background:var(--pink-soft)}
.tag.pin{background:var(--sunk);color:var(--muted)}
.dday{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.need{font-size:12px;font-weight:600;color:var(--maybe)}
.ev-title{margin-top:2px;font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.ev-meta,.ev-sub{margin-top:2px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.votes{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 4px;font-weight:600;font-size:14px}
.vbtn[data-s="Y"][aria-pressed="true"]{background:var(--yes-soft);border-color:var(--yes);color:var(--yes)}
.vbtn[data-s="N"][aria-pressed="true"]{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.vbtn[data-s="M"][aria-pressed="true"]{background:var(--maybe-soft);border-color:var(--maybe);color:var(--maybe)}
.vbtn:disabled{opacity:.55;cursor:not-allowed}
.sum{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.bar .y{background:var(--yes)} .bar .n{background:var(--no)} .bar .m{background:var(--maybe)}
.counts{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.counts b{color:var(--ink);font-weight:600}
.ev-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ev-foot .sp{flex:1}
.names{grid-column:1/-1;display:grid;gap:10px}
.grp-h{font-size:12px;font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums}
.grp-h.y{color:var(--yes)} .grp-h.n{color:var(--no)} .grp-h.m{color:var(--maybe)} .grp-h.x{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--sunk);border-radius:999px;padding:2px 10px;font-size:13px}
.none{font-size:13px;color:var(--muted)}

/* 공지 · 알림 · 팀 */
.nt{display:grid;gap:8px}
.nt-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.nt-title{font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.nt-body{white-space:pre-wrap;overflow-wrap:anywhere}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink)}
.chg{display:grid;gap:4px;font-size:14px}
.chg .arrow{color:var(--muted)}
.chg s{color:var(--muted)}
.mem{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem .nm{flex:1;min-width:120px;font-weight:500;overflow-wrap:anywhere}
.role{font-size:12px;font-weight:600;border:1px solid var(--ink);border-radius:999px;padding:1px 8px}
.role.m{background:var(--ink);color:#fff}

/* 폼 */
.form{display:grid;gap:12px;margin-top:16px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid #CFCFCF;border-radius:8px;padding:10px 12px}
textarea.inp{min-height:88px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px;font-weight:600;background:var(--surface)}
.opt input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.opt input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--no);font-size:13px;min-height:1.2em}
.hintline{font-size:13px;color:var(--muted)}
#formSlot:empty{display:none}
#formSlot .card{margin-top:12px}
.dl{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px 12px;margin-top:14px}
.dl dt{color:var(--muted);font-size:13px;padding-top:2px}
.dl dd{overflow-wrap:anywhere}
.big{font-family:var(--font-display);font-size:24px;line-height:1.25}

/* 로그인 */
.wrap.auth{max-width:400px;padding-block:56px 32px}
.auth .logo{height:auto;width:110px;margin-inline:auto;max-width:50%}
.status{margin-top:20px;font-size:13px;color:var(--muted);text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:4px;margin-top:16px}
.seg button{border:0;background:none;padding:9px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.hint{margin-top:16px;font-size:13px;color:var(--muted)}
.markall{margin-top:8px}
.btn:active,.vbtn:active,.chip:active,.tab:active{transform:scale(.95);filter:brightness(.9)}
.btn.busy{opacity:.55;pointer-events:none}
.btn.busy::after{content:' …'}
.btn.danger.armed{background:#C62828;border-color:#C62828;color:#fff}
.card.editing{outline:2px solid var(--pink);outline-offset:2px}
.card.editing::before{content:'수정 중';display:inline-block;font-size:12px;font-weight:700;color:var(--pink);margin-bottom:6px}
.nt.is-new{border-left:4px solid var(--pink)}
.nt.is-read{background:var(--sunk);opacity:.72}
.done{color:#1a7f37;font-weight:700;font-size:14px;padding:0 4px}
.note-banner.pinb{background:var(--surface);color:var(--ink);border-color:var(--line)}
.unitrow{display:flex;align-items:center;gap:8px}.unitrow .inp{max-width:110px}.unit{font-size:14px;color:var(--ink)}
select.inp{appearance:auto}
.ver{margin:28px 0 20px;text-align:center;font-size:11px;color:var(--muted);opacity:.8;font-variant-numeric:tabular-nums}
.hint b{color:var(--ink)}
.loading{padding:80px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.pmemo{display:block;font-size:13px;font-weight:400;color:var(--muted);white-space:pre-wrap;margin-top:2px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gal a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.flinks{display:flex;flex-direction:column;gap:6px}
.flink{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.flink::before{content:"↗ ";color:var(--pink)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.filebtn{display:inline-flex;align-self:flex-start;margin-top:6px;position:relative;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--pink);outline-offset:2px}
.flist{display:grid;gap:6px;margin-top:8px}
.frow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.frow span{overflow-wrap:anywhere;font-size:14px}
.tab{font-size:13px;padding-inline:0}
.resline{display:block;margin-top:4px;padding:0;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--tc);text-align:left;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.stats b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.rk{width:22px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rs{border-left:5px solid var(--tc);display:grid;gap:8px}
.score{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score .num{font-family:var(--font-display);font-size:32px;font-variant-numeric:tabular-nums;line-height:1}
.score .colon{color:var(--muted);font-size:24px}
.score .side{font-weight:600;overflow-wrap:anywhere}
.oc{margin-left:auto;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--ink)}
.oc-w{background:var(--ink);color:#fff}.oc-d{border-color:var(--line);color:var(--muted)}.oc-l{border-color:var(--line);color:var(--ink)}
.sc-line{font-size:14px;overflow-wrap:anywhere}
.scrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scrow .sc-m{flex:1 1 150px;min-width:0}
.scrow .sc-name{flex:1 1 130px;min-width:0}
.scrow .sc-n{flex:0 0 64px;width:64px}
.sclist{display:grid;gap:8px;margin-top:6px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.cal-h b{font-size:17px}
.cal-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:8px}
.cwd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.cwd.sun{color:#C0392B}
.cell{min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px 2px 2px;display:flex;flex-direction:column;gap:2px;font:inherit;text-align:center;cursor:pointer;min-width:0}
.cell.blank{border:0;background:none;cursor:default}
.cell .cn{font-size:12px;font-weight:600;align-self:flex-start;padding-left:3px;line-height:20px}
.cell.sun .cn{color:#C0392B}
.cell.today .cn{background:var(--ink);color:#fff;border-radius:999px;width:20px;padding:0;text-align:center}
.cell.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cc{display:block;font-style:normal;font-size:10px;font-weight:700;line-height:16px;border-radius:4px;color:#fff;background:var(--tc);border:1px solid var(--tc);white-space:nowrap;overflow:hidden}
.cc.need{background:var(--surface);color:var(--tc)}
.more{font-style:normal;font-size:10px;color:var(--muted)}
.vlinks{display:flex;flex-wrap:wrap;gap:6px}
.vlink{display:inline-block;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--surface);max-width:100%;overflow-wrap:anywhere}
.rg{border-left:5px solid var(--tc);display:grid;gap:8px;margin-top:12px}
.rg-sum{font-size:14px;font-weight:600;color:var(--tc)}
.game{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.g-top b{font-size:14px}
.plist{display:grid;gap:4px}
.prow{display:flex;align-items:baseline;gap:8px;font-size:14px;flex-wrap:wrap}
.prow .pl{min-width:52px;color:var(--muted);font-weight:600}
.prow .ps{font-variant-numeric:tabular-nums}
.prow .pscr{color:var(--muted);overflow-wrap:anywhere}
.pb{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;margin:0;min-width:0}
.pb-h{display:flex;gap:6px;align-items:center}.pb-h .p-label{flex:1;min-width:0}
.qrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rtotal{font-weight:700;font-variant-numeric:tabular-nums}
.inp.tall{min-height:150px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"><p class="loading">불러오는 중…</p></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var root=document.getElementById('root');
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var WD=['일','월','화','수','목','금','토'];
/* ===== 설정: Apps Script 배포 후 받은 웹 앱 주소를 아래 따옴표 안에 붙여넣으세요 ===== */
var API_URL='https://script.google.com/macros/s/AKfycbxqax6P73ku00JnNeIB7_nyLkolB1VkLus8AArccxH54Gy7vqQRlzg_pG24G3CFV_GPMg/exec';
var POLL_MS=45000;
var APP_VER='v2.0 · 2026-10-12';   /* 화면 버전: pkg/VERSION 값이 빌드할 때 들어가요 */
var serverVer='';
var COLS=['members','events','votes','notices','reads','alerts','places','posts','results','settings'];
var ETYPES=['훈련','매치','대회','모임'];
var BCATS=['포메이션','세트피스','로테이션','상대 분석','기타'];
var MAX_FILES=8,MAX_FILE=5*1024*1024;
var boardWrite='manager';

/* ---------- 유틸 ---------- */
function pad(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return ymd(new Date());}
function parseD(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function shift(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function addDays(n){return shift(todayStr(),n);}
function dayDiff(s){return Math.round((parseD(s)-parseD(todayStr()))/86400000);}
var TCLS={'훈련':'t-train','매치':'t-match','대회':'t-cup','모임':'t-meet'};
function tcls(t){return TCLS[t]||'t-train';}
function placeFull(e){return [e.place,e.detail].filter(Boolean).join(' ');}
function fmtMD(s){var d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';}
function fmtDT(e){return fmtMD(e.date)+(e.time?' '+e.time:'');}
function evKey(e){return e.date+' '+(e.time||'00:00');}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function val(id){var el=document.getElementById(id);return el?el.value:'';}
function safeUrl(u){u=(u||'').trim();return /^https?:\/\/\S+$/i.test(u)?u:'';}
var DEF_ST={dlDays:7,remindDays:3,eveDays:1};
function cfgS(){var s=(S.settings&&S.settings.main)||{},o={};Object.keys(DEF_ST).forEach(function(k){o[k]=s[k]!==undefined?s[k]:DEF_ST[k];});return o;}
function dlEff(e){return e.deadline||shift(e.date,-cfgS().dlDays);}
function mapLink(u){var s=safeUrl(u);return s?'<a class="maplink" href="'+esc(s)+'" target="_blank" rel="noopener noreferrer">지도</a>':'';}

function roleOf(id){var m=S.members[id];return m?(m.role||'member'):'member';}
/* 소유자: 마스터를 지정하는 사람. 마스터: 관리자를 지정하는 사람. 관리자: 일정·공지·장소를 관리하는 사람 */
function isOwner(){return amOwner;}

function canManage(){return isMaster()||myRole==='admin';}

function sortIds(ids){return ids.slice().sort(function(a,b){return nick(a).localeCompare(nick(b),'ko');});}

/* ---------- 서버 통신 (Google Apps Script) ---------- */
function configured(){return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(API_URL);}
async function call(a,p){
  var res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({a:a,t:token},p||{})),redirect:'follow'});
  var j;
  try{j=await res.json();}catch(e){throw new Error('서버 응답을 읽지 못했어요.');}
  if(!j.ok){var er=new Error(j.error||'처리하지 못했어요.');er.code=j.code||'error';throw er;}
  return j;
}
function toast(msg){
  var t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},3600);
}
function doLogout(){
  token=null;me=null;loaded=false;netErr=false;setSess(null);ui.form=null;ui.tab='events';
  renderAuth();
}
async function guard(fn){
  try{await fn();return true;}
  catch(e){
    if(e&&e.code==='auth'){doLogout();toast('다시 로그인해 주세요.');return false;}
    toast(e&&e.code?e.message:'저장하지 못했어요. 네트워크를 확인하고 다시 시도해 주세요.');
    return false;
  }
}
/* 서버에 쓰고 최신 상태를 다시 받아온다 */
async function act(a,p){
  return guard(async function(){
    pending++;
    var j=null;
    try{j=await call(a,Object.assign({sync:1},p||{}));}finally{pending--;}
    /* 쓰기 응답에 최신 데이터가 같이 오므로 다시 불러오지 않는다 */
    if(j&&j.data&&pending===0&&!syncing){applySync(j);render();}
    else await syncNow();
  });
}
function applySync(j){
  COLS.forEach(function(c){S[c]=j.data[c]||{};});
  boardWrite=(j.cfg&&j.cfg.boardWrite)||'manager';
  serverVer=(j.cfg&&j.cfg.ver)||'';
  oldServer=!(j.cfg&&j.cfg.types&&j.cfg.types.length>=4&&j.cfg.results&&j.cfg.periods&&j.cfg.settings);
  me=j.me.id;myRole=j.me.role;amOwner=!!j.me.owner;loaded=true;netErr=false;
}
async function syncNow(){
  if(!token)return;
  if(syncing||pending>0){again=true;return;}
  syncing=true;
  try{
    var j=await call('sync');
    applySync(j);
  }catch(e){
    if(e&&e.code==='auth'){syncing=false;doLogout();return;}
    netErr=true;
  }
  syncing=false;
  render();
  if(again){again=false;syncNow();}
}

}

async function doAuth(){
  var err=function(m){var e=document.getElementById('authErr');if(e)e.textContent=m;};
  if(!configured()){err('서버 주소가 아직 설정되지 않았어요.');return;}
  var name=val('f-name').replace(/\s+/g,''),pin=val('f-pin').trim(),su=ui.authMode==='signup';
  if(!/^[가-힣A-Za-z]{2,8}$/.test(name)){err('이름은 2~8자의 한글 또는 영문으로 입력해 주세요.');return;}
  if(!/^\d{4}$/.test(pin)){err('비밀번호는 숫자 4자리예요.');return;}
  if(su&&val('f-pin2').trim()!==pin){err('비밀번호 확인이 달라요.');return;}
  if(su&&!val('f-code').trim()){err('팀 가입 코드를 입력해 주세요.');return;}
  var btn=document.querySelector('#authForm button[type=submit]');
  if(btn){btn.disabled=true;btn.textContent='확인 중…';}
  err('');
  try{
    var j=await call(su?'signup':'login',{name:name,pin:pin,code:val('f-code').trim()});
    token=j.token;setSess(token);ui.tab='events';
    await syncNow();
    if(!loaded){err('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');token=null;setSess(null);if(btn){btn.disabled=false;btn.textContent=su?'가입하고 시작':'로그인';}}
  }catch(e){
    err(e&&e.code?e.message:'서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');
    if(btn){btn.disabled=false;btn.textContent=su?'가입하고 시작':'로그인';}
  }
}

/* ---------- 계산 ---------- */
function locked(e){return !canManage()&&todayStr()>dlEff(e);}
function needsVote(e){return e.date>=todayStr()&&!S.votes[e.id+'_'+me]&&!locked(e)&&canWrite;}
function tallyAll(){
  var t={};
  Object.keys(S.votes).forEach(function(k){
    var v=S.votes[k];if(!S.members[v.m]||!S.events[v.e])return;
    var g=t[v.e]||(t[v.e]={Y:[],N:[],M:[]});if(g[v.s])g[v.s].push(v.m);
  });
  return t;
}
function eventList(){return Object.keys(S.events).map(function(id){return Object.assign({id:id},S.events[id]);});}
function noticeList(){
  return Object.keys(S.notices).map(function(id){return Object.assign({id:id},S.notices[id]);}).sort(function(a,b){
    if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;return (b.at||0)-(a.at||0);
  });
}
function alertList(){
  var lim=Date.now()-14*86400000;
  return Object.keys(S.alerts).map(function(id){return Object.assign({id:id},S.alerts[id]);}).filter(function(a){return (a.at||0)>lim;}).sort(function(a,b){return (b.at||0)-(a.at||0);});
}
function unreadNotices(){return noticeList().filter(function(n){return !S.reads[n.id+'_'+me];}).length;}
function unreadAlerts(){return alertList().filter(function(a){return a.by!==me&&!S.reads[a.id+'_'+me];}).length;}
/* 열 때마다 계산하는 알림: 투표 마감 3일 전부터, 일정 전날과 당일 */
function disSet(){try{return JSON.parse(localStorage.getItem('nova_dis')||'{}')||{};}catch(e){return ui.disMem||{};}}
function disSave(o){ui.disMem=o;try{var ks=Object.keys(o);if(ks.length>200){var n={};ks.slice(-100).forEach(function(k){n[k]=1;});o=n;}localStorage.setItem('nova_dis',JSON.stringify(o));}catch(e){}}
function reminders(all){
  var up=eventList().filter(function(e){return e.date>=todayStr();}).sort(function(a,b){return evKey(a)<evKey(b)?-1:1;});
  var vote=[],eve=[],dis=disSet();
  up.forEach(function(e){
    var mine=(S.votes[e.id+'_'+me]||{}).s,n=dayDiff(dlEff(e)),d=dayDiff(e.date);
    if(!mine&&n>=0&&n<=cfgS().remindDays&&canWrite){var kv='v'+e.id;if(all||!dis[kv])vote.push({e:e,n:n,k:kv,dis:!!dis[kv]});}
    if(d<=cfgS().eveDays&&mine!=='N'){var ke='e'+e.id+'_'+d;if(all||!dis[ke])eve.push({e:e,d:d,k:ke,dis:!!dis[ke]});}
  });
  return {vote:vote,eve:eve};
}
function alertTotal(){var r=reminders();return unreadAlerts()+r.vote.length+r.eve.length;}
function diffEvent(old,o){
  var c=[];
  if(!old)return c;
  if(old.type!==o.type)c.push({f:'종류',from:old.type,to:o.type});
  if(old.date!==o.date||old.time!==o.time)c.push({f:'일시',from:fmtDT(old),to:fmtDT(o)});
  if((old.place||'')!==(o.place||''))c.push({f:'장소',from:old.place||'미정',to:o.place||'미정'});
  else if((old.map||'')!==(o.map||''))c.push({f:'장소',from:old.place||'미정',to:(o.place||'미정')+' (지도 링크 변경)'});
  if((old.detail||'')!==(o.detail||''))c.push({f:'세부 장소',from:old.detail||'없음',to:o.detail||'없음'});
  return c;
}

/* ---------- 화면 ---------- */

  if(!token||!loaded){
    if(token){
      root.dataset.screen='wait';
      root.innerHTML=netErr?'<div class="wrap"><div class="card empty" style="margin-top:48px"><b>서버에 연결하지 못했어요</b>잠시 후 다시 시도해 주세요.<div style="margin-top:12px"><button class="btn pri" data-act="retry">다시 시도</button></div></div></div>':'<p class="loading">불러오는 중…</p>';

/* 누른 버튼이 눈에 보이게: 삭제 확인 상태, 수정 중인 카드 표시 */
function decorate(){
  try{
    Array.prototype.forEach.call(document.querySelectorAll('.btn.danger'),function(b){if(b.textContent==='정말 삭제'){b.textContent='한 번 더 눌러 삭제';b.classList.add('armed');}});
    Array.prototype.forEach.call(document.querySelectorAll('.card.editing'),function(c){c.classList.remove('editing');});
    var f=ui.form;
    if(f&&f.id){Array.prototype.forEach.call(document.querySelectorAll('[data-act^=edit]'),function(b){
      var d=b.dataset;if(d.e===f.id||d.n===f.id||d.p===f.id||d.b===f.id){var c=b.closest('.card');if(c)c.classList.add('editing');}});}
  }catch(e){}
}

/* 일정 */
function eventsHTML(){
  var today=todayStr(),t=tallyAll(),all=eventList();
  var up=all.filter(function(e){return e.date>=today;}).sort(function(a,b){return evKey(a)<evKey(b)?-1:1;});
  var past=all.filter(function(e){return e.date<today;}).sort(function(a,b){return evKey(a)<evKey(b)?1:-1;});
  var f=ui.filter;
  var shown=up.filter(function(e){return f==='all'||(f==='need'?needsVote(e):e.type===f);});
  var cnt={all:up.length,need:up.filter(needsVote).length};ETYPES.forEach(function(t){cnt[t]=up.filter(function(e){return e.type===t;}).length;});
  var un=unreadNotices(),ua=alertTotal(),out='';

  noticeList().filter(function(n){return n.pinned;}).slice(0,3).forEach(function(n){out+='<button class="note-banner pinb" data-act="tab" data-t="notices">📌 '+esc(n.title)+' ›</button>';});
  out+=viewHead('다가오는 일정');
  out+='<div class="chips" role="group" aria-label="일정 필터">'+[['all','전체']].concat(ETYPES.map(function(t){return [t,t];}),[['need','투표 필요']]).map(function(c){return '<button class="chip" data-act="filter" data-f="'+c[0]+'" aria-pressed="'+(f===c[0])+'">'+(TCLS[c[0]]?'<span class="dot '+TCLS[c[0]]+'"></span>':'')+c[1]+'<i>'+cnt[c[0]]+'</i></button>';}).join('')+'</div>';
  if(!up.length){
    out+='<div class="card empty"><b>등록된 다가오는 일정이 없어요</b>'+(canEditData()?'위의 일정 등록으로 첫 일정을 추가해 보세요.':'관리자가 일정을 등록하면 여기에 날짜순으로 보여요.')+'</div>';
  }else if(!shown.length){
    out+='<div class="card empty"><b>조건에 맞는 일정이 없어요</b>다른 필터를 눌러 보세요.</div>';
  }else{
    var lastM='';
    shown.forEach(function(e){
      var d=parseD(e.date),ml=(d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+'년 ':'')+(d.getMonth()+1)+'월';
      if(ml!==lastM){out+='<p class="month">'+ml+'</p>';lastM=ml;}
      out+=evCard(e,t,false);
    });
  }
  if(past.length){
    out+='<div class="head-row"><button class="btn sm" data-act="togglepast" aria-expanded="'+ui.showPast+'">지난 일정 '+past.length+'개 '+(ui.showPast?'접기':'보기')+'</button></div>';
    if(ui.showPast)past.forEach(function(e){out+=evCard(e,t,true);});
  }
  return out;
}
function evCard(e,t,past){
  var d=parseD(e.date),diff=dayDiff(e.date),tl=t[e.id]||{Y:[],N:[],M:[]};
  var total=memberCount(),done=tl.Y.length+tl.N.length+tl.M.length,no=Math.max(0,total-done);
  var mine=(S.votes[e.id+'_'+me]||{}).s;
  var lock=past||!canWrite||locked(e);
  var dd=past?'':(diff===0?'오늘':diff===1?'내일':'D-'+diff);
  var meta=esc([e.time,placeFull(e)].filter(Boolean).join(' · '))+mapLink(e.map);
  var sub=['투표 마감 '+fmtMD(dlEff(e))+(todayStr()>dlEff(e)?' · 마감됨':'')];
  if(e.memo)sub.push(e.memo);
  var pct=function(c){return total?(c/total*100):0;};
  var mg=canEditData(),open=!!ui.open[e.id];
  var vb=[['Y','참석'],['N','불참'],['M','미정']].map(function(v){
    return '<button class="vbtn" data-act="vote" data-e="'+esc(e.id)+'" data-s="'+v[0]+'" aria-pressed="'+(mine===v[0])+'"'+(lock?' disabled':'')+'>'+v[1]+'</button>';
  }).join('');
  var h='<article class="card ev '+tcls(e.type)+(past?' is-past':'')+'">'+
    '<div class="ev-date"><span class="mo">'+(d.getMonth()+1)+'월</span><span class="dd">'+d.getDate()+'</span><span class="wd">'+WD[d.getDay()]+'</span></div>'+
    '<div><div class="ev-top"><span class="tag ty">'+esc(e.type)+'</span>'+(dd?'<span class="dday">'+dd+'</span>':'')+(!past&&!mine&&!lock?'<span class="need">투표 필요</span>':'')+'</div>'+
    '<h3 class="ev-title">'+esc(e.title||e.type)+'</h3>'+(meta?'<p class="ev-meta">'+meta+'</p>':'')+'<p class="ev-sub">'+esc(sub.join(' · '))+'</p>'+resLine(e)+'</div>'+
    '<div class="votes" role="group" aria-label="참석 투표">'+vb+'</div>'+
    '<div class="sum"><div class="bar" role="img" aria-label="참석 '+tl.Y.length+', 불참 '+tl.N.length+', 미정 '+tl.M.length+', 미응답 '+no+'">'+
    '<i class="y" style="width:'+pct(tl.Y.length)+'%"></i><i class="n" style="width:'+pct(tl.N.length)+'%"></i><i class="m" style="width:'+pct(tl.M.length)+'%"></i></div>'+
    '<div class="counts"><span>참석 <b>'+tl.Y.length+'</b></span><span>불참 <b>'+tl.N.length+'</b></span><span>미정 <b>'+tl.M.length+'</b></span><span>미응답 <b>'+no+'</b></span></div></div>';
  if(open){
    var voted={};tl.Y.concat(tl.N,tl.M).forEach(function(id){voted[id]=1;});
    var rest=Object.keys(S.members).filter(function(id){return !voted[id];});
    var grp=function(c,l,ids){return '<div><div class="grp-h '+c+'">'+l+' '+ids.length+'</div><div class="pills">'+(ids.length?sortIds(ids).map(function(id){return '<span class="pill">'+esc(nick(id))+'</span>';}).join(''):'<span class="none">없음</span>')+'</div></div>';};
    h+='<div class="names">'+grp('y','참석',tl.Y)+grp('n','불참',tl.N)+grp('m','미정',tl.M)+grp('x','미응답',rest)+'</div>';

function readCard(id,body,extra){
  var rd=!!S.reads[id+'_'+me],open=!!ui.open['r'+id],total=memberCount(),readers={};
  Object.keys(S.reads).forEach(function(k){var r=S.reads[k];if(r.n===id&&S.members[r.m])readers[r.m]=1;});

    var un=Object.keys(S.members).filter(function(m){return !readers[m];});

function readB64(file){
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var u=String(r.result||'');res(u.slice(u.indexOf(',')+1));};r.onerror=function(){rej(new Error('read'));};r.readAsDataURL(file);});
}
/* 사진은 긴 변 1800px, JPEG로 줄여서 올린다 (PDF·GIF는 그대로) */
function shrinkImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,1800/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
        var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
        var u=c.toDataURL('image/jpeg',0.85);URL.revokeObjectURL(url);
        res({type:'image/jpeg',data:u.slice(u.indexOf(',')+1)});
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
async function addPicked(inp){
  var err=function(m){var x=document.getElementById('formErr');if(x)x.textContent=m;};
  var files=Array.prototype.slice.call(inp.files||[]);inp.value='';
  if(!files.length)return;
  keepDraft();
  var msg='';
  for(var i=0;i<files.length;i++){
    var f=files[i],isPdf=f.type==='application/pdf',isImg=/^image\//.test(f.type);
    if(!isPdf&&!isImg){msg='이미지와 PDF만 올릴 수 있어요. ('+f.name+')';continue;}
    var kept=(ui.form.id&&S.posts[ui.form.id]?(S.posts[ui.form.id].files||[]):[]).filter(function(x){return ui.files.keep.indexOf(x.id)>=0;}).length;
    if(kept+ui.files.add.length>=MAX_FILES){msg='첨부는 최대 '+MAX_FILES+'개예요.';break;}
    try{
      var o;
      if(isImg&&f.type!=='image/gif'){try{o=await shrinkImage(f);}catch(e){o=null;}}
      if(!o){o={type:f.type,data:await readB64(f)};}
      var size=Math.floor(o.data.length*3/4);
      if(size>MAX_FILE){msg='5MB가 넘는 파일은 올릴 수 없어요. ('+f.name+')';continue;}
      var nm=f.name;if(o.type==='image/jpeg'&&!/\.jpe?g$/i.test(nm))nm=nm.replace(/\.[^.]*$/,'')+'.jpg';
      ui.files.add.push({name:nm,type:o.type,data:o.data,size:size});
    }catch(e){msg='파일을 읽지 못했어요. ('+f.name+')';}
  }
  paintForm();
  if(msg)err(msg);
}

function parseLinkLines(text,max){
  var out=[],lines=String(text||'').split('\n');

    var ln=lines[i].trim();if(!ln)continue;
    var ix=ln.search(/\s*\|\s*https?:\/\//),label='',u=ln;
    if(ix>=0){label=ln.slice(0,ix).trim();u=ln.slice(ln.indexOf('|',ix)+1).trim();}

  }

async function saveResult(){
  var err=function(m){var x=document.getElementById('formErr');if(x)x.textContent=m;};
  readResDraft();var d=ui.form.draft;
  if(!d.e){err('연결할 매치나 대회 일정을 골라 주세요. 일정이 없다면 먼저 일정을 등록해 주세요.');return;}
  var periods=[];
  for(var pi=0;pi<d.ps.length;pi++){
    var p=d.ps[pi],nm=(p.label.trim()||(d.ps.length>1?(pi+1)+'번째 구간':'점수'));
    if(!/^\d{1,2}$/.test(p.us.trim())||!/^\d{1,2}$/.test(p.them.trim())){err(nm+': 양 팀 점수를 0~99 사이 숫자로 입력해 주세요.');return;}
    var us=+p.us,sum=0,list=[];
    for(var i=0;i<p.sc.length;i++){
      var x=p.sc[i],n=+x.n;
      if(!x.m&&!x.name.trim()&&!x.n)continue;
      if(!x.m&&!x.name.trim()){err(nm+': 득점자 이름을 입력하거나 멤버를 골라 주세요.');return;}
      if(!(n>=1&&n<=30&&n===Math.floor(n))){err(nm+': 득점 수는 1 이상의 숫자로 입력해 주세요.');return;}
      sum+=n;list.push({m:x.m,name:x.name.trim(),n:n});
    }
    if(sum>us){err(nm+': 득점자 합계('+sum+')가 NOVA 득점('+us+')보다 많아요. 자책골은 상대 득점에 포함해 주세요.');return;}
    periods.push({label:p.label.trim(),us:us,them:+p.them,scorers:list});
  }
  var lk=parseLinkLines(d.links,MAX_VIDEOS);if(lk.err){err(lk.err);return;}
  if(await act('saveResult',{id:ui.form.id||null,e:d.e,round:d.round.trim(),opp:d.opp.trim(),periods:periods,links:lk.links,note:d.note.trim()})){
    ui.form=null;paintForm();paintApp();toast('경기 결과를 저장했어요.');
  }
}

  catch(e){ui.form={kind:'share',text:text};paintForm();}
}

/* ---------- 이벤트 ---------- */
root.addEventListener('submit',function(ev){
  ev.preventDefault();
  var id=ev.target.id;
  if(id==='authForm')doAuth();
  else if(id==='evForm'){var o=collectEvent();if(o){ui.form.pending=o;paintForm();}}
  else if(id==='ntForm')saveNotice();
  else if(id==='plForm')savePlace();
  else if(id==='rsForm')saveResult();
  else if(id==='evlForm')saveEvLinks();
  else if(id==='bdForm')saveBoard();
});
root.addEventListener('input',function(ev){
  var t=ev.target;if(!t)return;
  if(t.hasAttribute&&t.hasAttribute('data-digits'))t.value=t.value.replace(/\D/g,'');
  if(t.id==='fe-deadline')ui.dlTouched=true;
  if(t.id&&t.id.indexOf('st-')===0)ui.sd=readSettingsDOM();
  if(t.classList&&(t.classList.contains('p-us')||t.classList.contains('p-them')))updateResTotal();
});
root.addEventListener('change',function(ev){
  var t=ev.target;if(!t)return;
  if(t.id&&t.id.indexOf('st-')===0)ui.sd=readSettingsDOM();
  if(t.id==='fe-date'&&!ui.dlTouched&&t.value){var d=shift(t.value,-cfgS().dlDays);if(d<todayStr())d=todayStr();if(d>t.value)d=t.value;document.getElementById('fe-deadline').value=d;}
  if(t.id==='fb-pick'){addPicked(t);return;}
  if(t.id==='fr-ev'){var oe=S.events[t.value],oi=document.getElementById('fr-opp');if(oi&&!oi.value.trim())oi.value=guessOpp(oe);return;}
  if(t.classList&&t.classList.contains('sc-m')){readResDraft();paintForm();return;}
  if(t.id==='fe-pick'){var p=S.places[t.value];document.getElementById('fe-place').value=p?p.name:'';document.getElementById('fe-map').value=p?(p.url||''):'';}
});
root.addEventListener('click',async function(ev){
  var b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,d=b.dataset,prev=ui.confirm;ui.confirm=null;
  if(/^(del|readitem|pin|commit|remdone|readall|savesettings)/.test(a)&&!(prev==null&&/^del/.test(a)))b.classList.add('busy');
  switch(a){
    case 'authmode':ui.authMode=d.m;renderAuth();break;
    case 'logout':doLogout();break;
    case 'retry':netErr=false;render();syncNow();break;
    case 'tab':ui.tab=d.t;ui.form=null;paintForm();paintApp();window.scrollTo(0,0);break;
    case 'gotovote':ui.tab='events';ui.filter='need';ui.form=null;paintForm();paintApp();window.scrollTo(0,0);break;
    case 'filter':ui.filter=d.f;paintApp();break;
    case 'togglepast':ui.showPast=!ui.showPast;paintApp();break;
    case 'expand':ui.open[d.e]=!ui.open[d.e];paintApp();break;
    case 'expandread':ui.open['r'+d.n]=!ui.open['r'+d.n];paintApp();break;
    case 'vote':{
      var vid=d.e+'_'+me,cur=S.votes[vid],ns=(cur&&cur.s===d.s)?null:d.s;
      if(ns)S.votes[vid]={e:d.e,m:me,s:ns,t:Date.now()};else delete S.votes[vid];
      paintApp();
      if(!(await act('vote',{e:d.e,s:ns})))await syncNow();
      paintApp();break;
    }
    case 'rf':ui[d.k]=d.f;paintApp();break;
    case 'readall':{
      var ids=d.k==='notices'?noticeList().filter(function(n){return !S.reads[n.id+'_'+me];}).map(function(n){return n.id;}):alertList().filter(alertIsUnread).map(function(a){return a.id;});
      if(d.k==='alerts'){var dm=disSet();reminders().vote.concat(reminders().eve).forEach(function(x){dm[x.k]=1;});disSave(dm);}
      if(!ids.length){paintApp();break;}
      ids.forEach(function(i){S.reads[i+'_'+me]={n:i,m:me,t:Date.now()};});paintApp();
      if(!(await act('readMany',{ids:ids})))await syncNow();
      paintApp();break;
    }
    case 'remdone':{var dm2=disSet();dm2[d.k]=1;disSave(dm2);paintApp();toast('확인 처리했어요.');break;}
    case 'savesettings':await saveSettings();break;
    case 'readitem':{
      S.reads[d.n+'_'+me]={n:d.n,m:me,t:Date.now()};paintApp();toast('확인 처리했어요.');
      if(!(await act('read',{n:d.n})))await syncNow();
      paintApp();break;
    }
    case 'newevent':ui.form={kind:'event',id:null,pre:d.d?{date:d.d}:null};ui.dlTouched=false;paintForm();break;
    case 'editevent':ui.form={kind:'event',id:d.e};ui.dlTouched=true;paintForm();break;
    case 'editback':ui.form.pending=null;ui.dlTouched=true;paintForm();break;
    case 'commitevent':await commitEvent();break;
    case 'newnotice':ui.form={kind:'notice',id:null};paintForm();break;
    case 'editnotice':ui.form={kind:'notice',id:d.n};paintForm();break;
    case 'newplace':ui.form={kind:'place',id:null};paintForm();break;
    case 'editplace':ui.form={kind:'place',id:d.p};paintForm();break;
    case 'newpost':ui.form={kind:'post',id:null};ui.files={keep:[],add:[]};paintForm();break;
    case 'editpost':{var ep=S.posts[d.b];ui.form={kind:'post',id:d.b};ui.files={keep:ep?(ep.files||[]).map(function(x){return x.id;}):[],add:[]};paintForm();break;}
    case 'bcat':ui.bcat=d.c;paintApp();break;
    case 'rmkeep':ui.files.keep=ui.files.keep.filter(function(x){return x!==d.k;});keepDraft();paintForm();break;
    case 'rmadd':ui.files.add.splice(+d.i,1);keepDraft();paintForm();break;
    case 'delpost':{
      var k5='bd:'+d.b;if(prev!==k5){ui.confirm=k5;paintApp();break;}
      if(await act('delBoard',{id:d.b}))toast('글을 삭제했어요.');
      paintApp();break;
    }
    case 'pinpost':{await act('pinBoard',{id:d.b,pinned:!(S.posts[d.b]&&S.posts[d.b].pinned)});paintApp();break;}
    case 'calview':ui.view=d.v;try{localStorage.setItem('nova-view',d.v);}catch(e){}paintApp();break;
    case 'calnav':{var cm=ui.calMonth||todayStr().slice(0,7),cy=+cm.slice(0,4),cmo=+cm.slice(5,7)+(+d.d);var nd2=new Date(cy,cmo-1,1);ui.calMonth=nd2.getFullYear()+'-'+(nd2.getMonth()<9?'0':'')+(nd2.getMonth()+1);ui.calSel='';paintApp();break;}
    case 'caltoday':ui.calMonth=todayStr().slice(0,7);ui.calSel=todayStr();paintApp();break;
    case 'calsel':ui.calSel=d.d;paintApp();break;
    case 'gotoevent':{var ge=S.events[d.e];if(ge){ui.tab='events';ui.view='cal';ui.filter='all';ui.calMonth=ge.date.slice(0,7);ui.calSel=ge.date;ui.form=null;paintForm();paintApp();window.scrollTo(0,0);}break;}
    case 'rfilter':ui.rfilter=d.f;paintApp();break;
    case 'newresult':ui.tab='results';ui.form={kind:'result',id:null,e:d.e||''};paintForm();paintApp();break;
    case 'editresult':ui.form={kind:'result',id:d.r};paintForm();break;
    case 'addscorer':readResDraft();ui.form.draft.ps[+d.p].sc.push({m:'',name:'',n:'1'});paintForm();break;
    case 'rmscorer':readResDraft();ui.form.draft.ps[+d.p].sc.splice(+d.i,1);paintForm();break;
    case 'rmperiod':readResDraft();ui.form.draft.ps.splice(+d.p,1);paintForm();break;
    case 'addperiod':{
      readResDraft();var ps=ui.form.draft.ps;
      if(ps.length>=MAX_PERIODS){toast('구간은 최대 '+MAX_PERIODS+'개예요.');break;}
      var blank=ps.length===1&&!ps[0].label.trim()&&ps[0].us===''&&ps[0].them===''&&!ps[0].sc.length;
      if(d.k==='q'){var qn=ps.filter(function(x){return /쿼터$/.test(x.label.trim());}).length;if(blank)ps[0].label='1쿼터';else ps.push(blankPeriod((qn+1)+'쿼터'));}
      else if(d.k==='h'){if(ps.length>2){toast('구간이 이미 많아요. 필요 없는 구간을 먼저 빼 주세요.');break;}ps[0].label='전반';if(!ps[1])ps.push(blankPeriod('후반'));else ps[1].label='후반';}
      else ps.push(blankPeriod('연장'));
      paintForm();break;
    }
    case 'gotores':{ui.tab='results';ui.rfilter='all';ui.form=null;paintForm();paintApp();var gel=document.getElementById('rg-'+d.e);if(gel)gel.scrollIntoView({block:'start'});break;}
    case 'editevlinks':ui.form={kind:'evlinks',id:d.e};paintForm();break;
    case 'delresult':{
      var k6='rs:'+d.r;if(prev!==k6){ui.confirm=k6;paintApp();break;}
      if(await act('delResult',{id:d.r}))toast('결과를 삭제했어요.');
      paintApp();break;
    }
    case 'cancelform':ui.form=null;paintForm();break;
    case 'sharevote':{var se=S.events[d.e];if(se)await copyShare(shareVoteText(Object.assign({id:d.e},se)));break;}
    case 'sharealert':{var sa=S.alerts[d.a];if(sa)await copyShare(shareAlertText(sa));break;}
    case 'delevent':{
      var k='ev:'+d.e;if(prev!==k){ui.confirm=k;paintApp();break;}
      if(await act('delEvent',{id:d.e}))toast('일정을 삭제했어요. 취소 알림이 올라갔어요.');
      paintApp();break;
    }
    case 'delnotice':{
      var k2='nt:'+d.n;if(prev!==k2){ui.confirm=k2;paintApp();break;}
      if(await act('delNotice',{id:d.n}))toast('공지를 삭제했어요.');
      paintApp();break;
    }
    case 'pinnotice':{
      var n=S.notices[d.n];if(n)await act('saveNotice',{id:d.n,title:n.title,body:n.body,pinned:!n.pinned});
      paintApp();break;
    }
    case 'delplace':{
      var k4='pl:'+d.p;if(prev!==k4){ui.confirm=k4;paintApp();break;}
      if(await act('delPlace',{id:d.p}))toast('장소를 삭제했어요.');
      paintApp();break;
    }
    case 'toggleadmin':case 'togglemaster':{
      var cr=roleOf(d.m),nr=a==='toggleadmin'?(cr==='admin'?'member':'admin'):(cr==='master'?'member':'master');
      await act('setRole',{m:d.m,role:nr});
      paintApp();break;
    }
    case 'delmember':{
      var k3='mb:'+d.m;if(prev!==k3){ui.confirm=k3;paintApp();break;}
      if(await act('delMember',{m:d.m}))toast('멤버를 삭제했어요.');
      paintApp();break;
    }
  }
});

/* ---------- 시작 ---------- */
(function boot(){
  try{var vv=localStorage.getItem('nova-view');if(vv==='cal'||vv==='list')ui.view=vv;}catch(e){}
  token=getSess();
  if(configured()&&token){root.dataset.screen='wait';root.innerHTML='<p class="loading">불러오는 중…</p>';syncNow();}
  else{token=null;renderAuth();}
  setInterval(function(){if(!document.hidden&&token&&loaded)syncNow();},POLL_MS);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&token&&loaded)syncNow();});
})();
})();
</script>
